<div class="login-wrap">
  <div class="shell">
    <!-- Marca -->
    <div class="brand">VIAS UC</div>

    <div class="grid">
      <!-- PANEL IZQUIERDO FORMULARIO -->
      <section class="panel form-panel">
        <h1>Crear Cuenta</h1>
        <p class="muted">
          Si ya tienes una cuenta, puedes iniciar sesión aquí.
          <a routerLink="/login" class="link">Iniciar Sesión</a>
        </p>

        <form class="form" (ngSubmit)="onSubmit()">

          <!-- Nombre -->
          <label class="lbl">Nombre</label>
          <div class="input underline">
            <span class="icon">
              <!-- user icon -->
              <svg width="18" height="18" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <input
              type="text"
              [(ngModel)]="nombre"
              name="nombre"
              required
              placeholder="Introducir Nombre"
            />
          </div>

          <!-- Apellido -->
          <label class="lbl">Apellido</label>
          <div class="input underline">
            <span class="icon">
              <!-- user icon -->
              <svg width="18" height="18" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <input
              type="text"
              [(ngModel)]="apellido"
              name="apellido"
              required
              placeholder="Introducir Apellido"
            />
          </div>

          <!-- Email -->
          <label class="lbl">Correo Electrónico</label>
          <div class="input underline">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" />
                <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </span>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="Introducir Correo"
            />
          </div>

          <!-- Contraseña -->
          <label class="lbl">Contraseña</label>
          <div class="input underline">
            <span class="icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10V7a4 4 0 118 0v3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <input
              type="password"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="Introducir Contraseña"
            />
          </div>

        <!-- Rol -->
        <label class="lbl">Rol</label>
        <div class="input underline">
          <span class="icon">🎓</span>
          <select [(ngModel)]="rol" name="rol" required>
            <option value="" disabled selected>Seleccionar rol</option>
            <option value="alumno">Alumno</option>
            <option value="profesor">Profesor</option>
            <option value="egresado">Egresado</option>
            <option value="empresa">Empresa</option>
          </select>
        </div>
          <button class="btn-primary" type="submit">Registrarme</button>

          <p *ngIf="errorMsg" class="error">{{ errorMsg }}</p>
          </form>
          <app-popup-registrar *ngIf="mostrarPopup" (aceptar)="cerrarPopupYAbrirLogin()">
          </app-popup-registrar>

      </section>

      <!-- PANEL DERECHO HERO -->
      <section class="panel hero-panel">
        <div class="hero-card">
          <img src="login-hero.png" alt="Ilustración" class="hero-img" />
        </div>
      </section>
    </div>
  </div>
</div>
