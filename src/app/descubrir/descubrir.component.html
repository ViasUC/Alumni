<app-panel-lista activo="descubrir"></app-panel-lista>

<div class="descubrir-page">
  <!-- encabezado + búsqueda -->
  <div class="header">
    <h1>Descubrir</h1>

    <div class="search-box">
      <input
        type="text"
        placeholder="Buscar usuarios…"
        [(ngModel)]="termino"
      />
    </div>
  </div>

  <!-- listado -->
  <div class="lista">
    <ng-container *ngIf="usuariosFiltrados.length; else sinResultados">

      <div class="usuario-card" *ngFor="let u of usuariosFiltrados">

        <!-- lado izquierdo: avatar + datos → abre el popup -->
        <div class="left" (click)="abrirPerfil(u)" style="cursor:pointer">
          <div class="avatar-mini">
            {{ u.nombre[0] }}{{ u.apellido[0] }}
          </div>
          <div class="info">
            <h2>{{ u.nombre }} {{ u.apellido }}</h2>
            <p class="meta">
              {{ u.carrera }} • {{ u.rol }} • {{ u.ubicacion }}
            </p>
          </div>
        </div>

        <!-- acciones → evitamos que hagan click en el popup -->
        <div class="actions" (click)="$event.stopPropagation()">
          <!-- ya somos contactos -->
          <button
            *ngIf="u.conectado"
            class="btn-connected"
            disabled
          >
            Ya conectado
          </button>

          <!-- solicitud enviada -->
          <div *ngIf="!u.conectado && u.solicitudEnviada" class="solicitud-wrap">
            <button class="btn-disabled" disabled>Solicitud Enviada</button>
            <button class="btn-danger" (click)="cancelarSolicitud(u)">Descartar</button>
          </div>

          <!-- botón conectar -->
          <button
            *ngIf="!u.conectado && !u.solicitudEnviada"
            class="btn-primary"
            (click)="conectar(u)"
          >
            Conectar
          </button>
        </div>
      </div>

    </ng-container>

    <ng-template #sinResultados>
      <div class="empty">No se encontraron usuarios.</div>
    </ng-template>
  </div>
</div>

<!-- POPUP PERFIL BÁSICO -->
<app-popup-perfil-basico
  *ngIf="verPerfil && perfilSeleccionado"
  [perfil]="perfilSeleccionado"
  (cerrar)="cerrarPerfil()"
></app-popup-perfil-basico>
