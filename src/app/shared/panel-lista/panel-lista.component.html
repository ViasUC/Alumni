<header class="topbar">
  <a class="back-btn" routerLink="/dashboard">Volver al inicio</a>

  <nav class="tabs">
    <a
      class="tab"
      [class.active]="activo === 'oportunidades'"
      routerLink="/oportunidades"
    >
      OPORTUNIDADES
    </a>
    <a
      class="tab"
      [class.active]="activo === 'actividad'"
      routerLink="/mi-actividad"
    >
      MI ACTIVIDAD
    </a>
    <a
      class="tab"
      [class.active]="activo === 'descubrir'"
      routerLink="/descubrir"
    >
      DESCUBRIR
    </a>
    <a
      class="tab"
      [class.active]="activo === 'red'"
      routerLink="/red-personal"
    >
      RED PERSONAL
    </a>
    <a
      class="tab"
      [class.active]="activo === 'portafolio'"
      routerLink="/portafolio"
    >
      PORTAFOLIO
    </a>
    <a
      class="tab"
      [class.active]="activo === 'posgrados'"

    >
      POSGRADOS
    </a>
  </nav>

  <div class="avatar">
    <span class="circle"></span>

</header>
