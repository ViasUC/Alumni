<!-- barra reutilizable -->
<app-panel-lista activo="oportunidades"></app-panel-lista>

<!-- contenido propio de la pantalla -->
<div class="op-page">
  <div class="op-panel">
    <div class="op-header">
      <h2>Oportunidades</h2>
      <button class="btn-primary" (click)="abrirAgregar()">
        + Agregar Oportunidad
      </button>
    </div>

    <div class="op-lista">
      <div class="op-item" *ngFor="let op of oportunidades">
        <div class="text">
          <h3>{{ op.titulo }}</h3>
          <p>{{ op.descripcion }}</p>
          <small *ngIf="op.ubicacion || op.modalidad" class="meta">
            {{ op.ubicacion }} • {{ op.modalidad }}
          </small>
        </div>

        <div class="actions">

          <!-- ============================================================
               MÍAS (Botones: Editar / Eliminar / Ver Postulantes)
          ============================================================ -->
          <ng-container *ngIf="op.creadaPorUsuario; else noPropias">
            <button class="btn-primary" (click)="abrirEditar(op)">Editar</button>
            <button class="btn-danger" (click)="abrirEliminar(op)">Eliminar</button>
            <button class="btn-primary" (click)="abrirPostulantes(op)">
              Ver postulantes
            </button>
          </ng-container>

          <!-- ============================================================
               NO MÍAS — ver detalles, postular, despostular, badge estado
          ============================================================ -->
          <ng-template #noPropias>

            <!-- ==========================
                 SI NO ESTOY POSTULADO
            =========================== -->
            <ng-container *ngIf="!op.postulado">
              <button class="btn-primary" (click)="abrirDetalle(op)">
                Ver detalles
              </button>

              <button class="btn-primary" (click)="togglePostulacion(op)">
                Postular
              </button>
            </ng-container>

            <!-- ==========================
                 SI YA ESTOY POSTULADO
            =========================== -->
            <!-- ==========================
     SI YA ESTOY POSTULADO
=========================== -->
<ng-container *ngIf="op.postulado">

  <!-- BADGE DE ESTADO -->
  <span
    class="estado-pill"
    [ngClass]="{
      'estado-pendiente': op.estadoPostulacion === 'pendiente',
      'estado-aceptada': op.estadoPostulacion === 'aceptada',
      'estado-rechazada': op.estadoPostulacion === 'rechazada'
    }"
  >
    {{ op.estadoPostulacion | uppercase }}
  </span>

  <!-- VER DETALLES SIEMPRE -->
  <button
    class="btn-primary"
    (click)="abrirDetalle(op)"
  >
    Ver detalles
  </button>

  <!-- DESPOSTULAR SOLO SI ESTÁ PENDIENTE -->
  <button
    *ngIf="op.estadoPostulacion === 'pendiente'"
    class="btn-danger"
    (click)="despostular(op)"
  >
    Despostular
  </button>

</ng-container>


          </ng-template>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- POPUPS -->

<app-popup-detalle
  *ngIf="popup === 'detalle'"
  [data]="seleccionada"
  (cerrar)="cerrarPopup()"
  (postular)="marcarPostulado($event)">
</app-popup-detalle>

<app-popup-postulacion
  *ngIf="popup === 'postulacion'"
  (cerrar)="cerrarPopup()">
</app-popup-postulacion>

<app-popup-editar
  *ngIf="popup === 'editar'"
  [data]="seleccionada"
  (cerrar)="cerrarPopup()"
  (guardar)="guardarOportunidad($event)">
</app-popup-editar>

<app-popup-eliminar
  *ngIf="popup === 'eliminar'"
  [data]="seleccionada"
  (cancelar)="cerrarPopup()"
  (eliminar)="confirmarEliminar()">
</app-popup-eliminar>

<app-popup-confirmar
  *ngIf="popup === 'confirmar'"
  (cancelar)="cerrarPopup()"
  (guardar)="cerrarPopup()">
</app-popup-confirmar>

<app-popup-postulante
  *ngIf="popup === 'postulante'"
  [data]="seleccionada"
  (cerrar)="cerrarPopup()"
  (verPerfil)="verPerfilPostulante($event)">
</app-popup-postulante>

<app-popup-perfil-postulante
  *ngIf="popup === 'perfilPostulante'"
  [data]="postulanteSeleccionado"
  (cerrar)="popup = 'postulante'">
</app-popup-perfil-postulante>
