<div class="login-wrap">
  <!-- Contenedor blanco con borde redondeado -->
  <div class="shell">
    <!-- Marca arriba a la izquierda -->
    <div class="brand">VIAS UC</div>

    <div class="grid">
      <!-- PANEL IZQUIERDO (Formulario) -->
      <section class="panel form-panel">
        <h1>Iniciar Sesión</h1>
        <p class="muted">
          Si aún no tienes cuenta, puedes registrarte aquí.
          <a routerLink="/register" class="link">Registrarme</a>
        </p>

        <form class="form" (ngSubmit)="onSubmit()">
          <!-- Email -->
          <label class="lbl">Correo Electrónico</label>
          <div class="input underline">
            <span class="icon" aria-hidden="true">
              <!-- email icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.6" />
                <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="1.6" />
              </svg>
            </span>
            <input
  type="email"
  [(ngModel)]="email"
  name="email"
  required
  placeholder="Introducir Correo" />
          </div>

          <!-- Password -->
          <label class="lbl">Contraseña</label>
          <div class="input underline">
            <span class="icon" aria-hidden="true">
              <!-- lock icon -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 10V7a4 4 0 118 0v3" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <input
  type="password"
  [(ngModel)]="password"
  name="password"
  required
  placeholder="Introducir Contraseña" />
            <span class="trailing" title="Mostrar/Ocultar (mock)">👁️</span>
          </div>

          <div class="row small">
            <label class="remember">
              <input type="checkbox" />
              <span>Recordar mi sesión</span>
            </label>
            <a routerLink="/recover" class="link">¿Olvidaste tu contraseña?</a>
          </div>

          <button class="btn-primary" type="submit">Iniciar Sesión</button>

          <p *ngIf="errorMsg" class="error">{{ errorMsg }}</p>
        </form>
      </section>

      <!-- PANEL DERECHO (Hero) -->
      <section class="panel hero-panel" aria-label="Bienvenida">
        <div class="hero-card">
          <img src="login-hero.png" alt="Ilustración" class="hero-img" />
        </div>
      </section>
    </div>
  </div>
</div>
