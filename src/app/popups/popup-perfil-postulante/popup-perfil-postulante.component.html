<div class="overlay">

  <div class="popup popup-detalle" *ngIf="perfil">

    <!-- HEADER -->
    <div class="perfil-header">
      <h2>
        Perfil de {{ perfil.nombre }} {{ perfil.apellido }}
      </h2>

      <button class="close-icon" (click)="cerrar.emit()">×</button>
    </div>

    <div class="perfil-grid">

      <!-- ========================================= -->
      <!-- CARD IZQUIERDO: DATOS PERSONALES + ENDOS -->
      <!-- ========================================= -->
      <section class="card">
        <h3>Datos personales</h3>

        <div class="grid-fields">

          <label>
            <span>Nombre</span>
            <input
              [value]="perfil.nombre + ' ' + perfil.apellido"
              readonly
            />
          </label>

          <label>
            <span>Ubicación</span>
            <input [value]="perfil.ubicacion || '—'" readonly />
          </label>

          <label>
            <span>Teléfono</span>
            <input [value]="perfil.telefono || '—'" readonly />
          </label>

          <label>
            <span>Email</span>
            <input [value]="perfil.email || '—'" readonly />
          </label>

          <label>
            <span>Rol principal</span>
            <input [value]="perfil.rolPrincipal || perfil.rol || '—'" readonly />
          </label>

          <label>
            <span>Completitud</span>
            <input [value]="(perfil.completitud || 0) + '%'" readonly />
          </label>

          <label>
            <span>Título universitario</span>
            <input [value]="perfil.tituloUniversitario || '—'" readonly />
          </label>

          <label>
            <span>Año de egreso</span>
            <input [value]="perfil.anioEgreso || '—'" readonly />
          </label>

        </div>

        <!-- ======================= -->
        <!-- ENDORSEMENTS RECIBIDOS -->
        <!-- ======================= -->
        <h3 style="margin-top:2rem;">Endorsements recibidos</h3>

        <div *ngIf="perfil.endorsements?.length === 0" class="evidencia">
          <p style="opacity:.6;">Este usuario aún no recibió endorsements.</p>
        </div>

        <div class="evidencia" *ngFor="let e of perfil.endorsements">

  <!-- Mostrar SOLO el nombre -->
  <h5>{{ e.nombre }}</h5>

  <!-- Mostrar Rol y Fecha SOLO si no es el mensaje de bloqueo -->
  <ng-container *ngIf="e.nombre !== 'CONECTA PARA VER'">
    <p>Rol: {{ e.rol }}</p>
    <small>{{ e.fecha }}</small>
  </ng-container>

</div>


      </section>

      <!-- ======================== -->
      <!-- CARD DERECHO: PORTAFOLIO -->
      <!-- ======================== -->
      <section class="card">
        <h3>Portafolio</h3>

        <label>
          <span>Descripción</span>
          <textarea rows="3" readonly>{{ perfil.descripcion }}</textarea>
        </label>

        <label>
          <span>Skills</span>
          <input readonly [value]="perfil.skills" />
        </label>

        <label>
          <span>Visibilidad</span>
          <input readonly [value]="perfil.visibilidad" />
        </label>

        <label>
          <span>Última actualización</span>
          <input readonly [value]="perfil.ultimaActualizacion" />
        </label>

        <h4 class="sub">Evidencias vinculadas</h4>

        <div class="evidencia" *ngFor="let ev of perfil.evidencias">
          <div>
            <h5>{{ ev.titulo }}</h5>
            <p>{{ ev.descripcion }}</p>
            <small>{{ ev.tipo }}</small>
          </div>
        </div>

      </section>
    </div>

  </div>
</div>
