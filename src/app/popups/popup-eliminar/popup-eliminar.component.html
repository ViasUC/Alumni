<div class="overlay">
  <div class="modal">

    <p>¿Seguro que querés eliminar <b>{{ data?.titulo }}</b>?</p>
    <div class="actions">
      <button class="btn-secondary" (click)="cancelar.emit()">Cancelar</button>
      <button class="btn-danger" (click)="eliminar.emit()">Eliminar</button>
    </div>
  </div>
</div>
